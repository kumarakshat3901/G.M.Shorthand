<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>GM Shorthand & Typing Centre | Under Maintenance</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;}

        body{
            font-family:'Poppins',sans-serif;
            background:#F7F2E8;
            color:#2f2f2f;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:30px 20px;
        }

        .box{
            max-width:640px;
            width:100%;
            background:#fff;
            border-radius:28px;
            padding:50px 35px;
            box-shadow:0 20px 50px rgba(0,0,0,.08);
            border:1px solid rgba(184,145,70,.2);
        }

        .box img{
            width:110px;
            margin:0 auto 20px;
        }

        .gears{
            position:relative;
            width:120px;
            height:90px;
            margin:0 auto 25px;
            color:#B89146;
        }

        .gears .big{
            font-size:70px;
            position:absolute;
            left:10px;
            top:10px;
            animation:spin 8s linear infinite;
        }

        .gears .small{
            font-size:40px;
            position:absolute;
            right:5px;
            top:0;
            animation:spinBack 6s linear infinite;
            opacity:.8;
        }

        @keyframes spin{to{transform:rotate(360deg);}}
        @keyframes spinBack{to{transform:rotate(-360deg);}}

        h1{
            font-size:36px;
            font-weight:700;
            margin-bottom:14px;
            line-height:1.25;
        }

        h1 span{color:#B89146;}

        p{
            color:#555;
            font-size:17px;
            line-height:1.8;
            margin-bottom:12px;
        }

        .buttons{
            display:flex;
            gap:14px;
            justify-content:center;
            flex-wrap:wrap;
            margin-top:28px;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            padding:14px 28px;
            border-radius:50px;
            font-weight:600;
            text-decoration:none;
            color:#fff;
        }

        .call{background:#B89146;}
        .wa{background:#25D366;}

        .small-note{
            margin-top:28px;
            font-size:14px;
            color:#888;
        }

        @media(max-width:600px){
            h1{font-size:28px;}
            .box{padding:40px 22px;}
        }
    </style>
</head>

<body>

    <div class="box">

        <img src="images/logo.png" alt="GM Shorthand Logo">

        <div class="gears">
            <i class="fa-solid fa-gear big"></i>
            <i class="fa-solid fa-gear small"></i>
        </div>

        <h1>Website is <span>under maintenance</span></h1>

        <p>
            We are making some improvements to give you a better experience.
            We will be back shortly.
        </p>

        <p>
            For admissions and enquiries, you can still reach us anytime.
        </p>

        <div class="buttons">
            <a href="tel:+919470570575" class="btn call">
                <i class="fa-solid fa-phone"></i> Call Us
            </a>
            <a href="https://wa.me/919470570575" class="btn wa">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <p class="small-note">GM Shorthand & Typing Centre, Dhanbad</p>

    </div>

</body>
</html>
